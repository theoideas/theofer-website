name: Mantener Supabase Activo (Keep-Alive)

on:
  schedule:
    # Se ejecuta automáticamente todos los Lunes, Miércoles y Viernes a las 10:00 UTC
    - cron: '0 10 * * 1,3,5'
  # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub cuando quieras probarlo
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping a Supabase DB
    runs-on: ubuntu-latest
    steps:
      - name: Hacer consulta a la API de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Validar que los secrets existan
          if [ -z "$SUPABASE_URL" ]; then
            echo "❌ Error: El secret SUPABASE_URL no está definido o está vacío en GitHub Secrets."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ Error: El secret SUPABASE_ANON_KEY no está definido o está vacío en GitHub Secrets."
            exit 1
          fi

          # Limpiar espacios en blanco accidentales y barras finales
          CLEAN_URL=$(echo "$SUPABASE_URL" | tr -d '[:space:]' | sed 's:/*$::')
          CLEAN_KEY=$(echo "$SUPABASE_ANON_KEY" | tr -d '[:space:]')

          ENDPOINT="${CLEAN_URL}/rest/v1/leads?select=id&limit=1"
          echo "Haciendo petición a Supabase..."

          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -H "apikey: ${CLEAN_KEY}" \
            -H "Authorization: Bearer ${CLEAN_KEY}" \
            "$ENDPOINT")

          echo "Código HTTP recibido: $HTTP_STATUS"
          echo "Respuesta del servidor:"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Conexión exitosa con Supabase. Inactividad resuelta correctamente."
          else
            echo "⚠️ Supabase respondió con código de error $HTTP_STATUS"
            exit 1
          fi

